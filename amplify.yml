# AWS Amplify Hosting build spec (Gen 2): deploys the backend (Cognito, AppSync/DynamoDB, S3)
# for this branch, writes amplify_outputs.json, then builds and hosts the React app.
version: 1
backend:
  phases:
    build:
      commands:
        - npm ci --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
