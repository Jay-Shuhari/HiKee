<style>
/*
VOICE: calm desktop messenger, quiet chrome; photos and documents carry the colour.
IDEA: frosted panes over the reference's lavender-to-mint wash, like a native macOS messages client.
PICTURE: the live conversation, with photo grids, PDF previews and voice notes.
COLOUR and TYPE: lavender/blush/mint gradient, white glass panes, one sky-blue accent; Helvetica Neue where installed, Poppins elsewhere.
LAYOUT: media nav centred on the left, conversation centre (widest), Chats title + search + list + logout right.
*/
:root{color-scheme:light dark;
--shell:light-dark(#a9a8d2,#0d0c18);
--wash:light-dark(linear-gradient(155deg,#e7e5f4 0%,#efe2ec 42%,#e6e2ee 62%,#d9ebe7 100%),linear-gradient(155deg,#181729 0%,#221a29 45%,#131f1e 100%));
--glass:light-dark(rgba(255,255,255,.62),rgba(255,255,255,.05));--glass2:light-dark(rgba(255,255,255,.32),rgba(255,255,255,.025));
--card:light-dark(rgba(255,255,255,.82),rgba(255,255,255,.07));--edge:light-dark(rgba(255,255,255,.75),rgba(255,255,255,.08));
--line:light-dark(rgba(60,58,100,.10),rgba(255,255,255,.08));--ink:light-dark(#191a23,#ecebf3);--muted:light-dark(#5f6075,#a19fb3);
--faint:light-dark(#8e8ea3,#6f6d80);--accent:light-dark(#1f8bf5,#4ea2ff);--accent2:light-dark(#3aa7f7,#6bb4ff);
--accent-soft:light-dark(rgba(31,139,245,.12),rgba(78,162,255,.16));--recv:light-dark(rgba(255,255,255,.86),rgba(255,255,255,.08));
--hover:light-dark(rgba(255,255,255,.55),rgba(255,255,255,.06));--danger:light-dark(#ef5a24,#ff7a4d);--online:#22a55a;
--sb:light-dark(rgba(80,76,140,.22),rgba(255,255,255,.14));--sbh:light-dark(rgba(80,76,140,.42),rgba(255,255,255,.28));
--shadow:light-dark(0 12px 32px rgba(60,58,110,.16),0 12px 32px rgba(0,0,0,.5));--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.3,1.35,.45,1)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--shell);color:var(--ink);font:14.5px/1.5 "Helvetica Neue","Poppins",Helvetica,Arial,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
svg.i.sf [stroke-width]{stroke-width:.8}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* scrollbars */
@supports not selector(::-webkit-scrollbar){*{scrollbar-width:thin;scrollbar-color:var(--sb) transparent}}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--sb);border-radius:10px;border:3px solid transparent;background-clip:content-box;min-height:40px}
::-webkit-scrollbar-thumb:hover{background:var(--sbh);border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-corner{background:transparent}

.app{display:grid;grid-template-columns:240px minmax(0,1fr) 330px;height:100dvh;width:100%;background:var(--wash);overflow:hidden}

/* left */
.left{position:relative;background:var(--glass2);border-right:1px solid var(--edge);display:flex;flex-direction:column;justify-content:center;padding:20px 14px}
.brand{position:absolute;top:22px;left:24px;right:14px;display:flex;align-items:center;gap:10px;font-size:18px;font-weight:500;letter-spacing:-.01em}
.logo{width:36px;height:36px;flex:none;object-fit:contain;display:block}
.navh{font-size:12px;color:var(--faint);padding:0 14px 10px}
.nav{position:relative;display:flex;flex-direction:column;gap:6px}
.ind{position:absolute;left:0;right:0;top:0;height:46px;border-radius:12px;background:var(--card);box-shadow:0 1px 2px rgba(40,38,90,.06);transition:transform .45s var(--spring),opacity .25s;opacity:0;pointer-events:none}
.ni{position:relative;display:flex;align-items:center;gap:13px;height:46px;padding:0 14px;border-radius:12px;color:var(--muted);transition:color .2s,background-color .2s}
.ni:hover{background:var(--hover);color:var(--ink)}
.ni.on{color:var(--accent);background:none}
.ni .i{transition:transform .3s var(--spring)}.ni:hover .i{transform:scale(1.12) rotate(-4deg)}
.ni.on .i{animation:pop .45s var(--spring)}
@keyframes pop{40%{transform:scale(1.25)}}
.ni .lbl{flex:1;text-align:left;font-weight:500}
.cnt{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.ni.on .cnt{color:var(--accent)}

/* centre */
.centre{position:relative;display:flex;flex-direction:column;overflow:hidden}
.chead{flex:none;height:70px;margin:16px 18px 0;display:flex;align-items:center;gap:12px;padding:0 12px 0 16px;border-radius:18px;background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(14px);z-index:5}
.who{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.who .nm{font-size:17px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .st{font-size:13px;color:var(--muted);white-space:nowrap}
.acts{display:flex;gap:6px;position:relative}
.ib{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--muted);transition:background-color .2s,color .2s,transform .2s var(--spring)}
.ib:hover{background:var(--card);color:var(--ink)}
.ib:active{transform:scale(.9)}
.chead .acts>.ib{background:var(--card)}
.chead .acts>.ib:hover{color:var(--accent)}
.mob{display:none}

.av{flex:none;position:relative;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;letter-spacing:.02em}
.av>span{width:100%;height:100%;border-radius:50%;display:grid;place-items:center}
.av .on{position:absolute;right:0;bottom:0;width:11px;height:11px;border-radius:50%;background:var(--online);border:2px solid #fff}

.pane{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.pane.swap{animation:swap .42s var(--ease)}
@keyframes swap{from{opacity:0;transform:translateY(10px)}}
.msgs{flex:1;overflow-y:auto;padding:22px clamp(16px,3vw,44px) 10px;overscroll-behavior:contain}
.day{display:flex;justify-content:center;margin:6px 0 16px}
.day span{font-size:12px;color:var(--muted);padding:3px 12px;border-radius:20px;background:var(--glass)}
.msg{display:flex;gap:10px;align-items:flex-end;margin-top:16px}
.msg.cont{margin-top:4px}
.msg.me{justify-content:flex-end}
.msg.hid .av{visibility:hidden}
.stk{display:flex;flex-direction:column;gap:6px;max-width:min(560px,72%);align-items:flex-start}
.me .stk{align-items:flex-end}
.bub{padding:10px 15px;border-radius:18px 18px 18px 6px;background:var(--recv);white-space:pre-wrap;overflow-wrap:anywhere}
.me .bub{background:var(--accent);color:#fff;border-radius:18px 18px 6px 18px}
.meta{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--faint);padding:0 4px;font-variant-numeric:tabular-nums}
.meta svg.i{width:15px;height:15px;stroke-width:1.6}
.meta .read{color:var(--accent)}
.msg.enter{animation:enter .45s var(--ease) both}
@keyframes enter{from{opacity:0;transform:translateY(14px) scale(.97)}}
.msg.flash .stk>*{animation:flash 1.4s ease}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 3px transparent}}

/* image previews */
.ig{display:grid;gap:6px;width:440px;max-width:100%}
.ig button{position:relative;overflow:hidden;border-radius:14px;background:var(--recv);display:block}
.ig img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s var(--ease)}
.ig button:hover img{transform:scale(1.05)}
.ig.one{width:auto}
.ig.two{grid-template-columns:1fr 1fr}
.ig.two button,.ig.three button:not(.peek){aspect-ratio:3/4}
.ig.three{grid-template-columns:3fr 3fr 1fr}
.peek{height:100%}
.peek .ov{position:absolute;inset:0;background:rgba(18,16,40,.5);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:background-color .25s}
.peek:hover .ov{background:rgba(18,16,40,.66)}
.peek .ov b{font-size:15px;font-weight:600}

.vid{position:relative;width:340px;max-width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#111;display:block}
.vid img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s var(--ease)}
.vid:hover img{transform:scale(1.05)}
.play{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,255,255,.9);color:#191a23;display:grid;place-items:center;transition:transform .3s var(--spring)}
.vid:hover .play,.mtile:hover .play{transform:scale(1.1)}
.play svg{width:16px;height:16px;margin-left:2px}
.dur{position:absolute;right:8px;bottom:8px;font-size:12px;color:#fff;background:rgba(0,0,0,.5);padding:2px 7px;border-radius:6px;font-variant-numeric:tabular-nums}

/* voice note */
.aud{display:flex;align-items:center;gap:12px;padding:12px 18px 12px 12px;border-radius:18px;background:var(--recv);width:310px;max-width:100%}
.me .aud{background:var(--accent);color:#fff}
.ap{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none;transition:transform .2s var(--spring),background-color .2s}
.ap:hover{transform:scale(1.08)}
.me .ap{background:rgba(255,255,255,.2);color:#fff}
.ap:active{transform:scale(.88)}
.ap svg.i{width:12px;height:12px}
.wave{position:relative;flex:1;height:26px;cursor:pointer}
.bars{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;gap:2px}
.bars i{flex:0 0 3px;border-radius:2px;background:currentColor;opacity:.25}
.bars.fill{clip-path:inset(0 calc(100% - var(--p,0%)) 0 0);transition:clip-path .1s linear}
.bars.fill i{opacity:1;background:var(--accent)}
.me .bars.fill i{background:#fff}
.at{font-size:12px;font-variant-numeric:tabular-nums;opacity:.75;text-align:right}

/* documents */
.doc{display:flex;align-items:center;gap:12px;padding:10px 14px 10px 10px;border-radius:16px;background:var(--recv);text-align:left;width:320px;max-width:100%;transition:transform .2s var(--ease)}
.doc:hover{transform:translateY(-1px)}
.me .doc{background:var(--accent);color:#fff}
.ext{width:40px;height:46px;border-radius:9px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none}
.dn{flex:1;min-width:0}
.dn b{display:block;font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dn small{font-size:12px;opacity:.7}
.pdf{width:320px;max-width:100%;border-radius:18px;background:var(--recv);padding:8px;display:flex;flex-direction:column;gap:8px}
.me .pdf{background:var(--accent);color:#fff}
.pdfp{position:relative;display:block;height:168px;border-radius:12px;overflow:hidden;background:light-dark(#eceaf3,#24232f);padding:14px 18px 0;text-align:left}
.page{display:block;height:100%;background:#fff;border-radius:4px 4px 0 0;box-shadow:0 2px 10px rgba(40,38,90,.14);overflow:hidden;position:relative;transition:transform .45s var(--ease)}
.pdfp:hover .page{transform:translateY(-4px) scale(1.015)}
.page::after{content:"";position:absolute;left:0;right:0;bottom:0;height:46px;background:linear-gradient(transparent,#fff)}
.page img{width:100%;display:block}
.mp{display:block;width:560px;transform:scale(.5);transform-origin:0 0;padding:26px 30px;color:#1d1d26;font-size:12px;line-height:1.55}
.mp b{display:block;font-size:22px;line-height:1.2;margin-bottom:10px;font-weight:700}
.mp .rule{display:block;height:4px;width:54px;background:#e5484d;margin-bottom:14px;border-radius:2px}
.mp i{display:block;font-style:normal;margin-bottom:8px;color:#3a3a48}
.pgs{position:absolute;right:10px;bottom:10px;z-index:1;font-size:11px;padding:2px 8px;border-radius:20px;background:rgba(25,26,35,.72);color:#fff}
.pex{margin:0 6px;font-size:13px;line-height:1.45;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.me .pex{color:rgba(255,255,255,.85)}
.pft{display:flex;align-items:center;gap:10px;padding:2px 4px 2px 6px}
.pft .ext{width:34px;height:38px;font-size:10px}
.dl{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:inherit;opacity:.75;transition:background-color .2s,opacity .2s,transform .2s var(--spring)}
.dl:hover{opacity:1;background:var(--accent-soft);transform:translateY(-1px)}
.me .dl:hover{background:rgba(255,255,255,.18)}
.dl svg.i{width:18px;height:18px}

/* sheet + slide previews */
.ms{display:block;padding:10px 10px 0;font-size:10.5px;color:#1d1d26}
.ms .mtab{display:inline-block;font-size:9.5px;padding:2px 8px;border-radius:4px 4px 0 0;background:#1f9d55;color:#fff;margin-bottom:-1px}
.ms table,.bigsheet table{border-collapse:collapse;width:100%;table-layout:fixed}
.ms td,.ms th{border:1px solid #e3e5ea;padding:3px 5px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:400}
.ms th,.bigsheet th{background:#eef7f1;font-weight:600;color:#1f6f43}
.msl{display:flex;flex-direction:column;justify-content:center;height:100%;padding:16px 20px;background:linear-gradient(135deg,#fff 60%,#fff3ea);color:#1d1d26;border-top:4px solid #e8730c}
.msl b{font-size:15px;line-height:1.2;margin-bottom:8px;font-weight:600}
.msl i{font-style:normal;font-size:10.5px;color:#4a4a58;line-height:1.5}
.msl i::before{content:"•";color:#e8730c;margin-right:6px}
.pdfp.k-sheet{padding:12px 12px 0}.pdfp.k-slides{padding:14px 18px}
.pdfp.k-slides .page{border-radius:4px}.pdfp.k-slides .page::after{display:none}
.bigsheet{background:#fff;border-radius:6px;color:#1d1d26;overflow:auto;box-shadow:0 10px 30px rgba(0,0,0,.4);font-size:14px}
.bigsheet .stab{display:inline-block;margin:12px 12px 0;padding:4px 12px;border-radius:6px 6px 0 0;background:#1f9d55;color:#fff;font-size:12px}
.bigsheet td,.bigsheet th{border:1px solid #e3e5ea;padding:8px 12px;text-align:left;white-space:nowrap}
.bigsheet td.n{text-align:right;font-variant-numeric:tabular-nums}
.bigslide{width:100%;aspect-ratio:16/9;background:linear-gradient(135deg,#fff 60%,#fff3ea);border-top:8px solid #e8730c;border-radius:6px;color:#1d1d26;padding:clamp(20px,5vw,56px);display:flex;flex-direction:column;justify-content:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.bigslide h2{margin:0 0 18px;font-size:clamp(20px,3vw,34px);line-height:1.15;font-weight:600}
.bigslide p{margin:0 0 8px;font-size:clamp(13px,1.6vw,18px);color:#4a4a58}
.bigslide p::before{content:"•";color:#e8730c;margin-right:10px}
/* voice note live state */
.ameta{display:flex;flex-direction:column;align-items:flex-end;gap:2px;min-width:34px}
.hd{display:grid;color:var(--online);transition:color .5s,transform .4s var(--spring)}
.hd svg.i{width:13px;height:13px;stroke-width:1.6}
.aud.heard .hd{color:var(--accent);transform:scale(1.1)}
.me .hd,.me .aud.heard .hd{color:rgba(255,255,255,.85)}
.bars i{transition:transform .09s linear;transform-origin:center}
.bars.hfill{clip-path:inset(0 calc(100% - var(--h,0%)) 0 0)}
.bars.hfill i{opacity:.5;background:var(--accent)}
.me .bars.hfill i{background:#fff;opacity:.6}
.aud.playing .ap{box-shadow:0 0 0 calc(var(--lv,0) * 9px) var(--accent-soft);transition:box-shadow .09s linear,transform .2s var(--spring)}
.me .aud.playing .ap{box-shadow:0 0 0 calc(var(--lv,0) * 9px) rgba(255,255,255,.22)}

/* composer */
.composer{flex:none;padding:10px 18px 18px}
.box{position:relative;border:1px solid var(--edge);border-radius:20px;background:var(--glass);backdrop-filter:blur(14px);transition:border-color .2s,box-shadow .2s}
.box:focus-within{border-color:color-mix(in srgb,var(--accent) 55%,transparent);box-shadow:0 0 0 4px var(--accent-soft)}
.pending{display:flex;gap:8px;flex-wrap:wrap;padding:0 10px}
.pending:not(:empty){padding:10px 10px 0}
.chip{position:relative;display:flex;align-items:center;gap:8px;height:58px;padding:0 30px 0 8px;border-radius:12px;background:var(--card);font-size:13px;max-width:230px;animation:chip .4s var(--spring)}
.chip.img{width:58px;padding:0;overflow:hidden}
.chip.img img{width:100%;height:100%;object-fit:cover}
.chip .ext{width:34px;height:40px;font-size:10px}
.chip .cn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .cn small{display:block;color:var(--muted);font-size:11.5px}
.chip .rm{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:rgba(25,26,35,.7);color:#fff;display:grid;place-items:center}
.chip .rm svg{width:12px;height:12px;stroke-width:2.4}
.chip.out{animation:chipout .2s ease forwards}
@keyframes chip{from{opacity:0;transform:scale(.7) translateY(6px)}}
@keyframes chipout{to{opacity:0;transform:scale(.8)}}
.crow{display:flex;align-items:flex-end;gap:2px;padding:7px}
textarea{flex:1;border:0;outline:0!important;background:none;resize:none;padding:10px 8px;font-size:16px;line-height:1.4;max-height:140px;min-height:42px;height:42px;transition:height .15s}
textarea::placeholder{color:var(--faint)}
textarea.clear{animation:clr .35s var(--ease)}
@keyframes clr{from{opacity:0;transform:translateY(8px)}}
#attachBtn .i{transition:transform .35s var(--spring)}
#attachBtn.open{color:var(--accent);background:var(--accent-soft)}
#attachBtn.open .i{transform:rotate(45deg) scale(1.08)}
.sendb{position:relative;width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:grid;place-items:center;transition:transform .25s var(--spring),opacity .2s,filter .2s;flex:none;overflow:visible}
.sendb:hover{transform:scale(1.06) rotate(-6deg)}
.sendb:active{transform:scale(.86)}
.sendb[disabled]{opacity:.45;cursor:default;transform:none;filter:saturate(.6)}
.sendb.fly svg{animation:fly .6s var(--ease)}
@keyframes fly{35%{transform:translate(18px,-18px) rotate(12deg);opacity:0}36%{transform:translate(-14px,14px);opacity:0}100%{transform:none;opacity:1}}
.sendb .rp{position:absolute;inset:0;border-radius:inherit;border:2px solid var(--accent);pointer-events:none;animation:rp .6s ease-out forwards}
@keyframes rp{from{transform:scale(1);opacity:.8}to{transform:scale(1.8);opacity:0}}
.spark{position:fixed;width:6px;height:6px;border-radius:50%;pointer-events:none;z-index:200}
#micBtn.on{color:#fff;background:var(--danger)}

/* recording */
.recbar{display:none;align-items:center;gap:10px;padding:7px 7px 7px 10px;height:56px}
.box.rec .crow{display:none}.box.rec .recbar{display:flex;animation:swap .3s var(--ease)}
.rdot{width:10px;height:10px;border-radius:50%;background:var(--danger);animation:blink 1.1s infinite}
@keyframes blink{50%{opacity:.25}}
#rt{font-variant-numeric:tabular-nums;font-size:14px;min-width:40px}
.rwave{flex:1;display:flex;align-items:center;gap:3px;height:30px;overflow:hidden;justify-content:flex-end}
.rwave i{flex:0 0 3px;border-radius:2px;background:var(--accent);height:10%;transition:height .08s}

/* popovers */
.pw{position:relative}
.pop{position:absolute;bottom:calc(100% + 12px);z-index:20;background:light-dark(rgba(255,255,255,.96),#1d1c2a);border:1px solid var(--edge);border-radius:18px;box-shadow:var(--shadow);padding:8px;opacity:0;transform:translateY(10px) scale(.95);pointer-events:none;transition:opacity .2s,transform .35s var(--spring)}
.pop.open{opacity:1;transform:none;pointer-events:auto}
.attach{left:0;width:300px;transform-origin:20px 100%;padding:14px}
.att-h{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px 10px;font-weight:600}
.att-h small{font-weight:400;color:var(--faint);font-size:12px}
.att-g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:12px;border-radius:14px;text-align:left;background:light-dark(rgba(110,100,180,.06),rgba(255,255,255,.04));transition:transform .3s var(--spring),background-color .2s}
.pop.open .tile{animation:tile .5s var(--spring) both;animation-delay:var(--d)}
@keyframes tile{from{opacity:0;transform:translateY(14px) scale(.85)}}
.tile:hover{transform:translateY(-3px);background:light-dark(rgba(110,100,180,.11),rgba(255,255,255,.08))}
.tic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;box-shadow:0 6px 14px -6px var(--c);transition:transform .35s var(--spring)}
.tile:hover .tic{transform:rotate(-8deg) scale(1.1)}
.tile b{font-weight:500;font-size:14px}
.tile small{font-size:11.5px;color:var(--faint);margin-top:-6px}
.att-f{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:10px;padding:9px;border:1.5px dashed var(--line);border-radius:12px;font-size:12px;color:var(--faint)}
.emoji{right:0;width:300px;display:grid;grid-template-columns:repeat(8,1fr);gap:2px;transform-origin:100% 100%}
.emoji button{height:34px;border-radius:8px;font-size:20px;transition:background-color .15s,transform .25s var(--spring)}
.emoji button:hover{background:var(--accent-soft);transform:scale(1.25)}
.mi{display:flex;align-items:center;gap:10px;width:100%;height:40px;padding:0 10px;border-radius:10px;font-size:14px;text-align:left;transition:background-color .15s}
.mi:hover{background:var(--accent-soft)}
.mi.danger{color:var(--danger)}
.menu{top:calc(100% + 10px);bottom:auto;right:0;width:224px;transform-origin:100% 0}

/* drag and drop */
.drop{position:absolute;inset:12px 18px;z-index:25;border:2px dashed var(--accent);border-radius:22px;background:light-dark(rgba(240,244,255,.85),rgba(20,24,40,.85));backdrop-filter:blur(6px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--accent);font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s}
.drop.on{opacity:1}
.drop .tic{width:56px;height:56px;border-radius:18px;--c:var(--accent);background:linear-gradient(135deg,var(--accent),var(--accent2));animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}

/* media view */
.mbar{display:flex;align-items:center;gap:12px;padding:18px clamp(16px,3vw,44px) 14px}
.back{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px 0 8px;border-radius:10px;color:var(--muted);font-size:14px;background:var(--glass);transition:background-color .2s,color .2s}
.back:hover{color:var(--ink);background:var(--card)}
.mbar h2{margin:0;font-size:19px;font-weight:500;flex:1}
.mbar small{color:var(--muted);font-size:13px}
.mbody{flex:1;overflow-y:auto;padding:4px clamp(16px,3vw,44px) 32px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;align-items:start}
.dgrid .pdf,.dgrid .doc{width:auto}
.mtile,.dgrid>*,.mrow{animation:enter .45s var(--ease) both}
.mtile{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--recv)}
.mtile img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s var(--ease)}
.mtile:hover img{transform:scale(1.06)}
.mtile .play{width:38px;height:38px;margin:-19px 0 0 -19px}
.mlist{display:flex;flex-direction:column;gap:8px;max-width:720px}
.mrow{display:flex;align-items:center;gap:14px;padding:6px 14px 6px 6px;border-radius:18px;background:var(--glass)}
.mrow .aud{background:none;flex:1;max-width:440px;width:auto}
.mrow time{font-size:12px;color:var(--faint);white-space:nowrap}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:80px 20px;color:var(--muted)}
.empty svg.i{width:38px;height:38px;color:var(--faint)}
.empty b{color:var(--ink);font-size:16px;font-weight:500}
.btn{height:42px;padding:0 18px;border-radius:12px;background:var(--accent);color:#fff;font-weight:500;transition:transform .2s var(--spring),filter .2s}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.95)}
.btn.ghost{background:var(--card);color:var(--ink)}
.btn.red{background:var(--danger)}

/* right */
.right{background:var(--glass2);border-left:1px solid var(--edge);display:flex;flex-direction:column;min-height:0}
.rhead{display:flex;align-items:baseline;gap:8px;padding:24px 22px 0}
.rhead h2{margin:0;font-size:24px;font-weight:500;letter-spacing:-.01em}
.rhead span{font-size:13px;color:var(--faint)}
.search{margin:14px 16px 8px;display:flex;align-items:center;gap:8px;height:44px;padding:0 6px 0 14px;border:1px solid var(--edge);border-radius:14px;background:var(--glass);color:var(--faint);transition:border-color .2s,box-shadow .2s,background-color .2s}
.search:hover{background:var(--card)}
.search:focus-within{background:var(--card);border-color:color-mix(in srgb,var(--accent) 55%,transparent);box-shadow:0 0 0 4px var(--accent-soft);color:var(--accent)}
.search input{flex:1;border:0;outline:0;background:none;font-size:16px;color:var(--ink);height:100%}
.search input::placeholder{color:var(--faint)}
.search input::-webkit-search-cancel-button{display:none}
.search .clr{width:28px;height:28px;border-radius:8px;display:none;place-items:center;color:var(--muted)}
.search .clr svg{width:15px;height:15px}
.search.has .clr{display:grid}
.lh{font-size:12px;color:var(--faint);padding:6px 24px 4px;display:flex;justify-content:space-between}
.list{flex:1;overflow-y:auto;padding:2px 10px 18px;overscroll-behavior:contain;-webkit-mask-image:linear-gradient(#000 calc(100% - 28px),transparent);mask-image:linear-gradient(#000 calc(100% - 28px),transparent)}
.ci{display:flex;align-items:center;gap:12px;width:100%;padding:10px;border-radius:14px;text-align:left;transition:background-color .2s,transform .25s var(--spring);position:relative;animation:enter .4s var(--ease) both}
.ci:hover{background:var(--hover)}
.ci:active{transform:scale(.98)}
.ci.act{background:var(--card)}
.ct{flex:1;min-width:0}
.r1,.r2{display:flex;align-items:center;gap:8px}
.r1 b{flex:1;font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r1 time{font-size:12px;color:var(--faint);white-space:nowrap}
.ci.unr .r1 time{color:var(--accent)}
.pv{flex:1;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px}
.pv svg.i{width:14px;height:14px}
.ci.unr .pv{color:var(--ink)}
.pv mark{background:light-dark(#fff1b8,#5a4a10);color:inherit;border-radius:3px}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:#fff;font-size:11.5px;font-weight:600;display:grid;place-items:center}
.mute{color:var(--faint)}.mute svg.i{width:14px;height:14px}
.nores{padding:40px 16px;text-align:center;color:var(--muted);font-size:14px}
.rfoot{flex:none;padding:6px 16px 18px;display:flex;justify-content:center}
.logout{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:48px;border-radius:16px;color:var(--muted);background:var(--glass);font-weight:500;transition:color .2s,background-color .2s,transform .2s var(--spring)}
.logout:hover{color:var(--danger);background:var(--card)}
.logout:hover .i{transform:translateX(3px)}
.logout .i{transition:transform .3s var(--spring)}
.logout:active{transform:scale(.97)}

/* call */
.call{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:light-dark(rgba(236,233,246,.92),rgba(14,13,24,.92));backdrop-filter:blur(12px);opacity:0;pointer-events:none;transition:opacity .3s}
.call.open{opacity:1;pointer-events:auto}
.call .rings{position:relative;display:grid;place-items:center}
.call .rings::before,.call .rings::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:2px solid var(--accent);opacity:0;animation:ring 2s ease-out infinite}
.call .rings::after{animation-delay:1s}
@keyframes ring{0%{transform:scale(.85);opacity:.6}100%{transform:scale(1.5);opacity:0}}
.call h3{margin:8px 0 0;font-size:22px;font-weight:500}
.call p{margin:0;color:var(--muted)}
.end{width:58px;height:58px;border-radius:50%;background:var(--danger);color:#fff;display:grid;place-items:center;margin-top:18px;transition:transform .2s var(--spring)}
.end:hover{transform:scale(1.07)}.end:active{transform:scale(.9)}
.end svg.i{transform:rotate(135deg)}

/* gallery / viewer */
.gal{position:fixed;inset:0;z-index:100;background:rgba(12,11,22,.94);color:#fff;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .3s}
.gal.open{opacity:1;pointer-events:auto}
.gtop{display:flex;align-items:center;gap:10px;padding:14px 18px;flex:none}
.gtop .gc{flex:1;font-size:14px;color:rgba(255,255,255,.8);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gtop .gc b{color:#fff;font-weight:600;margin-right:10px}
.gb{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1);color:#fff;transition:background-color .2s,transform .2s var(--spring)}
.gb:hover{background:rgba(255,255,255,.2)}.gb:active{transform:scale(.9)}
.gb[disabled]{opacity:.3;cursor:default}
.gtop .dlb{width:auto;padding:0 16px 0 12px;border-radius:22px;gap:8px;display:flex;align-items:center;font-size:14px}
.gstage{position:relative;flex:1;min-height:0;transform:scale(.94);transition:transform .4s var(--ease)}
.gal.open .gstage{transform:none}
.track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;min-width:0;scroll-snap-align:center;display:grid;place-items:center;padding:4px 64px}
.slide>img,.slide>video{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;display:block}
.vp{position:relative;max-width:100%;max-height:100%;display:grid}
.vp canvas{max-width:100%;max-height:calc(100dvh - 190px);border-radius:8px}
.vp .vc{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:10px;padding:12px;background:linear-gradient(transparent,rgba(0,0,0,.6));border-radius:0 0 8px 8px}
.vp .vc .gb{width:36px;height:36px}
.vp .pb{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.3);position:relative;cursor:pointer}
.vp .pb i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:#fff;width:0}
.vp .vt{font-size:12px;font-variant-numeric:tabular-nums}
.pdfv{align-self:stretch;justify-self:center;width:min(900px,100%);overflow-y:auto;display:flex;flex-direction:column;gap:16px;padding:4px 6px 20px}
.pdfv img,.bigpage{width:100%;background:#fff;border-radius:6px;display:block;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.bigpage{color:#1d1d26;padding:clamp(24px,6vw,64px);font-size:15px;line-height:1.65;min-height:min(980px,140vw)}
.bigpage h1{font-size:28px;line-height:1.2;margin:0 0 12px}
.bigpage .rule{height:5px;width:70px;background:#e5484d;border-radius:3px;margin-bottom:24px}
.bigpage p{margin:0 0 14px;color:#3a3a48}
.gnav{position:absolute;top:50%;margin-top:-22px}
.gnav.p{left:16px}.gnav.n{right:16px}
.thumbs{display:flex;gap:6px;justify-content:center;padding:14px;flex:none;overflow-x:auto}
.thumbs button{width:52px;height:52px;border-radius:9px;overflow:hidden;opacity:.45;flex:none;transition:opacity .2s,transform .2s;outline-offset:2px}
.thumbs button.on{opacity:1;outline:2px solid #fff}
.thumbs img{width:100%;height:100%;object-fit:cover}

/* modal, toast, scrim, signed out */
.modal{position:fixed;inset:0;z-index:120;display:grid;place-items:center;background:rgba(20,18,40,.35);padding:20px;opacity:0;pointer-events:none;transition:opacity .2s}
.modal.open{opacity:1;pointer-events:auto}
.mcard{background:light-dark(#fff,#1d1c2a);border-radius:20px;padding:24px;width:min(380px,100%);box-shadow:var(--shadow);transform:translateY(10px) scale(.96);transition:transform .35s var(--spring)}
.modal.open .mcard{transform:none}
.mcard h3{margin:0 0 6px;font-size:18px;font-weight:500}
.mcard p{margin:0 0 20px;color:var(--muted)}
.mcard .row{display:flex;gap:8px;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:24px;z-index:130;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#191a23;color:#fff;padding:11px 12px 11px 16px;border-radius:14px;display:flex;align-items:center;gap:14px;font-size:14px;transition:opacity .2s,transform .35s var(--spring);max-width:calc(100vw - 32px)}
.toast.open{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:#6bb4ff;font-weight:600;padding:4px 6px}
.scrim{display:none}
.out{position:fixed;inset:0;z-index:140;display:grid;place-items:center;background:var(--shell);opacity:0;pointer-events:none;transition:opacity .35s}
.out.open{opacity:1;pointer-events:auto}
.out .mcard{text-align:center}
.out .logo{margin:0 auto 14px;width:64px;height:64px}

/* tablet */
@media(max-width:1180px){
.app{grid-template-columns:78px minmax(0,1fr) 290px}
.left{padding:20px 12px}.brand{left:0;right:0;justify-content:center}
.brand b,.navh,.ni .lbl,.ni .cnt{display:none}
.ni{justify-content:center;padding:0}
.chead{margin:12px 12px 0}.composer{padding:8px 12px 14px}
}
/* mobile: three pages (Chats home, conversation, Media) */
.tabbar,.mhead,.mrecent,.mlogo{display:none}
@media(max-width:780px){
.app{display:block;position:relative}
.left,.right,.centre{position:absolute;inset:0;width:auto;background:var(--wash);border:0;transition:transform .45s var(--ease),opacity .3s ease,visibility 0s linear .45s}
.left,.right{bottom:calc(66px + env(safe-area-inset-bottom))}
.right{transform:translateX(-22%);opacity:0;visibility:hidden}
.left{transform:translateX(22%);opacity:0;visibility:hidden}
.centre{transform:translateX(100%);visibility:hidden;z-index:3}
body[data-page=home] .right,body[data-page=media] .left,body[data-page=chat] .centre{transform:none;opacity:1;visibility:visible;transition:transform .45s var(--ease),opacity .3s ease,visibility 0s}
.tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;height:calc(66px + env(safe-area-inset-bottom));padding:6px 12px env(safe-area-inset-bottom);background:light-dark(rgba(255,255,255,.82),rgba(20,19,32,.88));backdrop-filter:blur(16px);border-top:1px solid var(--edge);transition:transform .4s var(--ease)}
body[data-page=chat] .tabbar{transform:translateY(110%)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;color:var(--faint);transition:color .2s}
.tab.on{color:var(--accent)}
.tab .ti{position:relative;display:grid;place-items:center;height:28px;transition:transform .4s var(--spring)}
.tab.on .ti{transform:translateY(-2px) scale(1.1)}
.tab .badge{position:absolute;top:-3px;left:16px;min-width:17px;height:17px;font-size:10px;padding:0 4px}
.tab .av{box-shadow:0 0 0 2px transparent;transition:box-shadow .2s}.tab.on .av{box-shadow:0 0 0 2px var(--accent)}
.mlogo{display:block;width:32px;height:32px}
.rhead{align-items:center;padding:18px 20px 0}
.left{justify-content:flex-start;padding:18px 16px 24px;overflow-y:auto}
.brand{position:static;justify-content:flex-start;padding:0 6px 20px}
.mhead{display:block;padding:0 6px 16px}.mhead h2{margin:0;font-size:26px;font-weight:500;letter-spacing:-.01em}.mhead span{font-size:13px;color:var(--muted)}
.brand b,.ni .lbl,.ni .cnt{display:revert}
.nav{gap:8px}.ind{display:none}
.ni{justify-content:flex-start;padding:0 18px;height:58px;background:var(--glass);border-radius:16px}
.ni.on{background:var(--card)}
.mrecent{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:22px}
.mrecent h3{grid-column:1/-1;margin:0 6px 4px;font-size:13px;font-weight:500;color:var(--muted)}
.mrecent button{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;animation:enter .45s var(--ease) both}
.mrecent img{width:100%;height:100%;object-fit:cover;display:block}
.mrecent .play{width:30px;height:30px;margin:-15px 0 0 -15px}
.mob{display:grid}
.chead{margin:8px 8px 0;padding:0 6px;gap:6px;height:64px}
.chead .acts>.ib{background:none}
.acts{gap:0}
.who .av{width:38px!important;height:38px!important}
.stk{max-width:86%}
.msg .av.sm{display:none}
.composer{padding:6px 8px calc(10px + env(safe-area-inset-bottom))}
.slide{padding:8px}
.gnav{display:none}
.gtop .dlb span{display:none}.gtop .dlb{padding:0;width:44px;justify-content:center}
.attach{width:min(300px,calc(100vw - 30px))}
.emoji{width:min(300px,calc(100vw - 30px))}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

const hm=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const sameDay=(a,b)=>new Date(a).toDateString()===new Date(b).toDateString();
function dayLabel(t){const n=new Date();if(sameDay(t,n))return'Today';const y=new Date(n);y.setDate(n.getDate()-1);if(sameDay(t,y))return'Yesterday';return new Date(t).toLocaleDateString([],{weekday:'long',day:'numeric',month:'long'})}
function listTime(t){const n=new Date();if(sameDay(t,n))return hm(t);const y=new Date(n);y.setDate(n.getDate()-1);if(sameDay(t,y))return'Yesterday';if(n-t<6*864e5)return new Date(t).toLocaleDateString([],{weekday:'short'});return new Date(t).toLocaleDateString([],{day:'numeric',month:'short'})}
const mmss=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const size=b=>b>=1e6?(b/1e6).toFixed(1)+' MB':Math.max(1,Math.round(b/1e3))+' KB';

/* ---------- message parts ---------- */
function imgGrid(imgs,mid){
  const b=(a,i,cls='')=>`<button class="${cls}" data-gal="${mid}" data-i="${i}" aria-label="Open image ${i+1} of ${imgs.length}"><img src="${a.src}" alt="${esc(a.name||'Shared image')}" loading="lazy"></button>`;
  if(imgs.length===1){const a=imgs[0],r=a.w/a.h,wd=r<1?Math.round(340*r):340;return`<div class="ig one" style="width:${wd}px"><button data-gal="${mid}" data-i="0" style="aspect-ratio:${a.w}/${a.h}" aria-label="Open image"><img src="${a.src}" alt="${esc(a.name||'Shared image')}"></button></div>`}
  if(imgs.length===2)return`<div class="ig two">${imgs.map((a,i)=>b(a,i)).join('')}</div>`;
  const extra=imgs.length-3;
  return`<div class="ig three">${b(imgs[0],0)}${b(imgs[1],1)}<button class="peek" data-gal="${mid}" data-i="2" aria-label="View all ${imgs.length} images"><img src="${imgs[2].src}" alt=""><span class="ov">${I('eye')}${extra>0?`<b>+${extra}</b>`:''}</span></button></div>`;
}
const NB=34;
function peaksFor(a,key){if(!a.peaks){const R=rng(hash(key));a.peaks=Array.from({length:NB},(_,i)=>.18+R()*.82*(.5+.5*Math.sin(i/3+R())))}return a.peaks}
function bars(pk){return pk.map(v=>`<i style="height:${Math.round(14+v*86)}%"></i>`).join('')}
function audHTML(a,key){const pk=peaksFor(a,key),b=bars(pk),h=(a.maxP||0)*100;
  return`<div class="aud ${a.heard?'heard':''}" data-aud="${key}"><button class="ap" aria-label="Play voice message">${I('play')}</button><div class="wave" style="--p:0%;--h:${h}%"><div class="bars">${b}</div><div class="bars hfill">${b}</div><div class="bars fill">${b}</div></div><span class="ameta"><span class="at">${mmss(a.dur||0)}</span><span class="hd" title="${a.heard?'Heard':'Not played yet'}">${I('mic')}</span></span></div>`}
async function peaksOf(blob){
  try{const C=window.AudioContext||window.webkitAudioContext;const ctx=new C();const buf=await ctx.decodeAudioData(await blob.arrayBuffer());ctx.close?.();
    const d=buf.getChannelData(0),step=Math.max(1,Math.floor(d.length/NB)),out=[];
    for(let i=0;i<NB;i++){let s=0;for(let j=i*step;j<Math.min(d.length,(i+1)*step);j+=8)s=Math.max(s,Math.abs(d[j]));out.push(s)}
    const mx=Math.max(...out,.01);return out.map(v=>Math.max(.06,v/mx))}catch(e){return null}}
function extBadge(name){const e=extOf(name);return`<span class="ext" style="background:${EXTC[e]||'#6b7280'}">${esc(e)}</span>`}
function docHTML(a,key){return`<button class="doc" data-doc="${key}">${extBadge(a.name)}<span class="dn"><b>${esc(a.name)}</b><small>${size(a.size)} · ${esc(extOf(a.name))}</small></span>${I('down')}</button>`}
function cellsHTML(r,tag,n){return r.slice(0,n).map(v=>`<${tag}${typeof v==='number'?' class="n"':''}>${esc(v)}</${tag}>`).join('')}
function miniPreview(a){
  if(a.thumb)return`<img src="${a.thumb}" alt="">`;
  const pv=a.pv,k=pv?.kind||docKind(a);
  if(!pv)return`<span class="mp"><b>${esc(a.name)}</b><span class="rule"></span><i>Preparing preview…</i></span>`;
  if(k==='sheet')return`<span class="ms"><span class="mtab">${esc(pv.sheet||'Sheet 1')}</span><table>${pv.rows.slice(0,8).map((r,i)=>`<tr>${cellsHTML(r,i?'td':'th',5)}</tr>`).join('')}</table></span>`;
  if(k==='slides')return`<span class="msl"><b>${esc(pv.title)}</b>${pv.paras.slice(0,4).map(x=>`<i>${esc(x)}</i>`).join('')}</span>`;
  return`<span class="mp"><b>${esc(pv.title)}</b><span class="rule" style="background:${EXTC[extOf(a.name)]||'#6b7280'}"></span>${pv.paras.slice(0,6).map(x=>`<i>${esc(x)}</i>`).join('')}</span>`;
}
function docCount(a){const pv=a.pv||{},k=pv.kind||docKind(a),n=pv.pages||a.pages||0;
  if(k==='sheet'){const sh=pv.sheets||1;return sh+(sh>1?' sheets':' sheet')}
  if(!n)return'';return n+(k==='slides'?(n>1?' slides':' slide'):(n>1?' pages':' page'))}
function docExcerpt(a){const pv=a.pv;if(!pv)return a.excerpt||'';
  if(pv.kind==='sheet'){const h=pv.rows[0]||[];return`${Math.max(0,pv.rows.length-1)} rows · ${h.length} columns: ${h.join(', ')}`}
  return pv.none?'':(pv.paras[0]||a.excerpt||'')}
function docHTML(a,key){
  if(!hasCard(a))return`<button class="doc" data-doc="${key}">${extBadge(a.name)}<span class="dn"><b>${esc(a.name)}</b><small>${size(a.size)} · ${esc(extOf(a.name))}</small></span>${I('down')}</button>`;
  const k=a.pv?.kind||docKind(a),cnt=docCount(a),ex=docExcerpt(a);
  return`<div class="pdf"><button class="pdfp k-${k}" data-pdf="${key}" aria-label="Preview ${esc(a.name)}"><span class="page">${miniPreview(a)}</span>${cnt?`<span class="pgs">${cnt}</span>`:''}</button>
  ${ex?`<p class="pex">${esc(ex)}</p>`:''}
  <div class="pft">${extBadge(a.name)}<span class="dn"><b>${esc(a.name)}</b><small>${size(a.size)}${cnt?` · ${cnt}`:''}</small></span><button class="dl" data-dl="${key}" aria-label="Download ${esc(a.name)}" title="Download">${I('down')}</button></div></div>`}
function vidHTML(a,key){return`<button class="vid" data-vid="${key}" aria-label="Play video ${esc(a.name)}">${a.poster?`<img src="${a.poster}" alt="">`:''}<span class="play">${I('play')}</span><span class="dur">${mmss(a.dur||0)}</span></button>`}
function ticks(m){return m.status==='sent'?I('check'):m.status==='delivered'?I('checks'):I('checks','read')}
function msgHTML(m,c,prev,next,isNew){
  const me=m.from==='me',imgs=m.atts.filter(a=>a.type==='image');
  const cont=prev&&prev.from===m.from&&m.t-prev.t<5*60000&&sameDay(prev.t,m.t);
  const last=!(next&&next.from===m.from&&next.t-m.t<5*60000&&sameDay(next.t,m.t));
  let body=imgs.length?imgGrid(imgs,m.id):'';
  m.atts.forEach((a,i)=>{const k=m.id+':'+i;if(a.type==='video')body+=vidHTML(a,k);if(a.type==='audio')body+=audHTML(a,k);if(a.type==='doc')body+=docHTML(a,k)});
  if(m.text)body+=`<div class="bub">${esc(m.text)}</div>`;
  if(last)body+=`<div class="meta">${hm(m.t)}${me?`<span id="tk-${m.id}" aria-label="${m.status}">${ticks(m)}</span>`:''}</div>`;
  return`<div class="msg ${me?'me':'them'} ${cont?'cont':''} ${!last?'hid':''} ${isNew?'enter':''}" id="m-${m.id}">${me?'':avatar(c,30,false,'sm')}<div class="stk">${body}</div></div>`;
}
function renderMsgs(swap,keep){
  stopAudio();
  const c=cur(),el=$('#msgs'),st=el.scrollTop;
  if(!c.msgs.length)el.innerHTML=`<div class="empty">${I('chats')}<b>No messages yet</b><span>Say hello to ${esc(c.name.split(' ')[0])}.</span></div>`;
  else el.innerHTML=c.msgs.map((m,i)=>{const p=c.msgs[i-1];return(!p||!sameDay(p.t,m.t)?`<div class="day"><span>${dayLabel(m.t)}</span></div>`:'')+msgHTML(m,c,p,c.msgs[i+1],false)}).join('');
  el.scrollTop=keep?st:el.scrollHeight;

}
function replay(el,cls){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls)}
function refreshMsg(m){const c=C.find(x=>x.msgs.includes(m));if(c!==cur())return;const i=c.msgs.indexOf(m),el=document.getElementById('m-'+m.id);if(!el)return;const t=document.createElement('div');t.innerHTML=msgHTML(m,c,c.msgs[i-1],c.msgs[i+1],false);el.replaceWith(t.firstElementChild)}

/* send: the bubble lifts out of the composer and springs into place */
function appendMsg(m,from){
  const c=cur(),el=$('#msgs'),i=c.msgs.indexOf(m),p=c.msgs[i-1];
  el.querySelector('.empty')?.remove();
  if(p){const pe=document.getElementById('m-'+p.id);if(pe){const t=document.createElement('div');t.innerHTML=msgHTML(p,c,c.msgs[i-2],m,false);pe.replaceWith(t.firstElementChild)}}
  el.insertAdjacentHTML('beforeend',(!p||!sameDay(p.t,m.t)?`<div class="day"><span>${dayLabel(m.t)}</span></div>`:'')+msgHTML(m,c,p,null,!from));
  const node=document.getElementById('m-'+m.id);
  const near=el.scrollHeight-el.scrollTop-el.clientHeight<400;
  if(from&&near&&node.animate&&!matchMedia('(prefers-reduced-motion: reduce)').matches){
    el.scrollTop=el.scrollHeight;
    const stk=node.querySelector('.stk'),r=stk.getBoundingClientRect();
    const dx=from.right-12-r.right,dy=from.top-r.top;
    stk.animate([{transform:`translate(${dx}px,${dy}px) scale(.82)`,opacity:.15,filter:'blur(3px)'},{transform:'translate(0,-6px) scale(1.02)',opacity:1,filter:'blur(0)',offset:.72},{transform:'none',opacity:1}],{duration:620,easing:'cubic-bezier(.2,.8,.2,1)'});
    node.querySelector('.meta')?.animate([{opacity:0,transform:'translateY(-4px)'},{opacity:0,offset:.6},{opacity:1,transform:'none'}],{duration:700});
  }else requestAnimationFrame(()=>el.scrollTo({top:el.scrollHeight,behavior:'smooth'}));

function tick(ts){if(!A.playing)return;if(A.el)A.t=A.el.currentTime;else{A.t+=(ts-A.last)/1000;A.last=ts}
  if(A.t>=A.dur){A.playing=false;A.a.maxP=1;A.t=0;audUI();return}audUI();A.raf=requestAnimationFrame(tick)}
function stopAudio(){if(!A.key)return;A.playing=false;cancelAnimationFrame(A.raf);A.el?.pause();A.t=0;audUI();A.key=null;A.el=null;A.an=null}
function toggleAudio(key){
  if(A.key!==key){stopAudio();const a=attByKey(key);if(!a)return;A.key=key;A.a=a;peaksFor(a,key);A.dur=a.dur||1;A.t=0;A.an=null;A.el=a.src?new Audio(a.src):null;
    if(A.el){A.el.onended=()=>{A.playing=false;A.a.maxP=1;A.t=0;audUI()};
      try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();actx.resume?.();const src=actx.createMediaElementSource(A.el),an=actx.createAnalyser();an.fftSize=512;src.connect(an);an.connect(actx.destination);A.an=an}catch(e){A.an=null}}}
  A.playing=!A.playing;
  if(A.playing){A.a.heard=true;if(A.el){A.el.currentTime=A.t;A.el.play().catch(()=>{A.playing=false;audUI();toast('This browser blocked audio playback.')})}A.last=performance.now();A.raf=requestAnimationFrame(tick)}
  else{A.el?.pause();cancelAnimationFrame(A.raf)}
  audUI();
}
function seekAudio(key,pct){if(A.key!==key)toggleAudio(key);A.t=pct*A.dur;if(A.el)A.el.currentTime=A.t;audUI()}

/* ---------- downloads ---------- */
const DLX=new Set('gif png jpg jpeg webp mp4 webm mov txt json md docx pptx epub csv pdf xlsx zip'.split(' '));
let DLNS=null;try{window.claude?.use?.('downloads')?.then(n=>{DLNS=n}).catch(()=>{})}catch(e){}
function b64Blob(u){const[h,d]=u.split(',');const bin=atob(d),arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new Blob([arr],{type:h.slice(5).split(';')[0]})}
function makePdf(p){
  const asc=s=>s.replace(/[’‘]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,'-').replace(/[^\x20-\x7e]/g,'').replace(/[\\()]/g,'\\$&');
  const wrap=(s,n)=>{const out=[];let line='';for(const w of s.split(' ')){if((line+' '+w).trim().length>n){out.push(line);line=w}else line=(line+' '+w).trim()}if(line)out.push(line);return out};
  let st='BT /F2 20 Tf 26 TL 56 780 Td ('+asc(p.title)+') Tj T* /F1 11 Tf 16 TL T*';
  p.paras.forEach(x=>{wrap(asc(x),92).forEach(l=>st+=' ('+l+') Tj T*');st+=' T*'});st+=' ET';
  const objs=['<< /Type /Catalog /Pages 2 0 R >>','<< /Type /Pages /Kids [3 0 R] /Count 1 >>','<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 4 0 R /F2 5 0 R >> >> /Contents 6 0 R >>','<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>','<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>',`<< /Length ${st.length} >>\nstream\n${st}\nendstream`];
  let out='%PDF-1.4\n';const offs=[];objs.forEach((o,i)=>{offs.push(out.length);out+=`${i+1} 0 obj\n${o}\nendobj\n`});
  const x=out.length;out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+offs.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${x}\n%%EOF`;
  return out;
}
function dlData(a){if(a.file)return a.file;if(a.type==='image'&&a.src?.startsWith('data:'))return b64Blob(a.src);if(a.pdf)return makePdf(a.pv);return null}
const canDl=a=>!!a&&!!dlData(a)&&DLX.has((a.name.split('.').pop()||'').toLowerCase());
async function download(a){
  const data=dlData(a);
  if(!data){toast(`${a.name} is sample content with no file behind it.`);return}
  if(!DLX.has((a.name.split('.').pop()||'').toLowerCase())){toast('This file type can’t be saved from here.');return}
  if(DLNS){try{await DLNS.save({filename:a.name,data});toast('Saved '+a.name)}catch(e){if(e?.code!=='declined')toast('Couldn’t save '+a.name+' here.')}return}
  const blob=typeof data==='string'?new Blob([data],{type:'application/pdf'}):data,url=URL.createObjectURL(blob),l=document.createElement('a');
  l.href=url;l.download=a.name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);
}

/* ---------- viewer: images, videos, PDFs ---------- */
const G={items:[],i:0,vp:null};
const track=$('#track');
let lastFocus=null;
function slideHTML(a,k){
  if(a.type==='image')return`<img src="${a.src}" alt="${esc(a.name||'Image')}">`;
  if(a.type==='video')return a.src?`<video src="${a.src}" controls playsinline preload="metadata"${a.poster?` poster="${a.poster}"`:''}></video>`:`<div class="vp" data-vp="${k}"><canvas width="960" height="540"></canvas><div class="vc"><button class="gb" data-vplay aria-label="Play">${I('play')}</button><div class="pb" data-vseek><i></i></div><span class="vt">0:00 / ${mmss(a.dur)}</span></div></div>`;
  if(a.type==='doc'){const pv=a.pv;
    if(a.pageImgs?.length)return`<div class="pdfv">${a.pageImgs.map(s=>`<img src="${s}" alt="">`).join('')}</div>`;
    if(!pv)return`<div class="pdfv"><div class="bigpage"><h1>${esc(a.name)}</h1><p>Preparing preview…</p></div></div>`;
    if(pv.kind==='sheet')return`<div class="pdfv"><div class="bigsheet"><span class="stab">${esc(pv.sheet||'Sheet 1')}</span><table>${pv.rows.map((r,i)=>`<tr>${cellsHTML(r,i?'td':'th',30)}</tr>`).join('')}</table></div></div>`;
    if(pv.kind==='slides')return`<div class="pdfv">${(pv.slides||[{title:pv.title,paras:pv.paras}]).map(x=>`<div class="bigslide"><h2>${esc(x.title)}</h2>${x.paras.map(p=>`<p>${esc(p)}</p>`).join('')}</div>`).join('')}</div>`;
    return`<div class="pdfv"><div class="bigpage"><h1>${esc(pv.title)}</h1><div class="rule" style="background:${EXTC[extOf(a.name)]||'#6b7280'}"></div>${pv.paras.map(p=>`<p>${esc(p)}</p>`).join('')}</div></div>`}
  return'';
}
function openViewer(items,i){
  lastFocus=document.activeElement;G.items=items;G.i=i;
  track.innerHTML=items.map((a,k)=>`<div class="slide" data-k="${k}">${slideHTML(a,k)}</div>`).join('');
  $('#thumbs').innerHTML=items.length>1?items.map((a,k)=>`<button data-th="${k}" aria-label="Show item ${k+1}"><img src="${a.type==='image'?a.src:a.poster||''}" alt=""></button>`).join(''):'';
  track.querySelectorAll('[data-vp]').forEach(el=>drawFrame(el.querySelector('canvas'),G.items[+el.dataset.vp],0));
  $('#gal').classList.add('open');goFull(true);
  requestAnimationFrame(()=>{track.scrollLeft=i*track.clientWidth;galUI();$('#gClose').focus()});
}
function closeViewer(){goFull(false);stopVP();track.querySelectorAll('video').forEach(v=>v.pause());$('#gal').classList.remove('open');setTimeout(()=>{if(!$('#gal').classList.contains('open'))track.innerHTML=''},300);lastFocus?.focus?.()}
function go(i){i=Math.max(0,Math.min(G.items.length-1,i));track.scrollTo({left:i*track.clientWidth,behavior:'smooth'})}
function galUI(){const a=G.items[G.i];$('#gc').innerHTML=`<b>${G.i+1} / ${G.items.length}</b>${esc(a?.name||'')}`;
  $('#gPrev').disabled=G.i<=0;$('#gNext').disabled=G.i>=G.items.length-1;$('#gPrev').hidden=$('#gNext').hidden=G.items.length<2;
  $('#gDl').hidden=!canDl(a);
  document.querySelectorAll('#thumbs button').forEach((b,k)=>{b.classList.toggle('on',k===G.i);if(k===G.i)b.scrollIntoView({block:'nearest',inline:'nearest'})})}
track.addEventListener('scroll',()=>{const i=Math.round(track.scrollLeft/Math.max(1,track.clientWidth));if(i!==G.i){G.i=i;galUI();stopVP();track.querySelectorAll('video').forEach(v=>v.pause())}},{passive:true});
function goFull(on){const g=$('#gal');try{if(on&&!document.fullscreenElement&&g.requestFullscreen)g.requestFullscreen().catch(()=>{});if(!on&&document.fullscreenElement)document.exitFullscreen().catch(()=>{})}catch(e){}}
function fsIcon(){$('#gFs').innerHTML=I(document.fullscreenElement?'shrink':'expand')}
document.addEventListener('fullscreenchange',()=>{fsIcon();requestAnimationFrame(()=>{track.scrollLeft=G.i*track.clientWidth})});
$('#gFs').onclick=()=>goFull(!document.fullscreenElement);
const trackRO=new ResizeObserver(()=>{if($('#gal').classList.contains('open'))track.scrollLeft=G.i*track.clientWidth});trackRO.observe(track);
$('#gPrev').onclick=()=>go(G.i-1);$('#gNext').onclick=()=>go(G.i+1);$('#gClose').onclick=closeViewer;$('#gDl').onclick=()=>download(G.items[G.i]);
$('#thumbs').addEventListener('click',e=>{const b=e.target.closest('[data-th]');if(b)go(+b.dataset.th)});
const posters={};
function posterImg(src){if(!posters[src]){const im=new Image();im.src=src;posters[src]=im}return posters[src]}
function drawFrame(cv,a,p){const g=cv.getContext('2d'),im=posterImg(a.poster);const draw=()=>{const s=1.08+.12*p,w=cv.width*s,h=cv.height*s;g.drawImage(im,-(w-cv.width)*p,-(h-cv.height)*(.5+.3*Math.sin(p*3)),w,h)};im.complete?draw():im.onload=draw}
function stopVP(){if(!G.vp)return;cancelAnimationFrame(G.vp.raf);G.vp.el.querySelector('[data-vplay]').innerHTML=I('play');G.vp.playing=false}
function vpUI(v){const a=G.items[v.k];v.el.querySelector('.pb i').style.width=(v.t/a.dur*100)+'%';v.el.querySelector('.vt').textContent=mmss(v.t)+' / '+mmss(a.dur);drawFrame(v.el.querySelector('canvas'),a,v.t/a.dur)}
function toggleVP(el){const k=+el.dataset.vp;if(!G.vp||G.vp.el!==el){stopVP();G.vp={el,k,t:0,playing:false,raf:0,last:0}}const v=G.vp;
  if(v.playing){stopVP();return}v.playing=true;v.last=performance.now();el.querySelector('[data-vplay]').innerHTML=I('pause');
  const step=ts=>{if(!v.playing)return;v.t+=(ts-v.last)/1000;v.last=ts;if(v.t>=G.items[k].dur){v.t=0;vpUI(v);stopVP();return}vpUI(v);v.raf=requestAnimationFrame(step)};v.raf=requestAnimationFrame(step)}
track.addEventListener('click',e=>{const pl=e.target.closest('[data-vplay]');if(pl){toggleVP(pl.closest('[data-vp]'));return}
  const sk=e.target.closest('[data-vseek]');if(sk){const el=sk.closest('[data-vp]');if(!G.vp||G.vp.el!==el)toggleVP(el);const r=sk.getBoundingClientRect();G.vp.t=(e.clientX-r.left)/r.width*G.items[G.vp.k].dur;vpUI(G.vp)}});

/* ---------- popovers, modal, toast, call ---------- */
function closePops(){document.querySelectorAll('.pop.open').forEach(p=>p.classList.remove('open'));$('#attachBtn').classList.remove('open')}
function togglePop(p){const o=!p.classList.contains('open');closePops();p.classList.toggle('open',o);return o}
let tT;function toast(msg,label,fn){$('#tMsg').textContent=msg;const b=$('#tAct');b.hidden=!label;b.textContent=label||'';b.onclick=()=>{fn&&fn();$('#toast').classList.remove('open')};$('#toast').classList.add('open');clearTimeout(tT);tT=setTimeout(()=>$('#toast').classList.remove('open'),label?6000:3400)}
function confirmBox(t,b,ok,cls,fn){$('#mT').textContent=t;$('#mB').textContent=b;const o=$('#mOk');o.textContent=ok;o.className='btn '+(cls||'');o.onclick=()=>{closeModal();fn()};$('#modal').classList.add('open');setTimeout(()=>o.focus(),50)}
function closeModal(){$('#modal').classList.remove('open')}
$('#mNo').onclick=closeModal;$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function startCall(kind){const c=cur(),el=$('#call');
  el.innerHTML=`<div class="rings">${avatar(c,96,false)}</div><h3>${esc(c.name)}</h3><p id="cst">${kind==='video'?'Starting video call…':'Calling…'}</p><button class="end" id="endCall" aria-label="End call">${I('phone')}</button>`;
  el.classList.add('open');$('#endCall').focus();$('#endCall').onclick=endCall;
  el._t=setTimeout(()=>{const s=$('#cst');if(s)s.textContent='Ringing…'},1400)}
function endCall(){const el=$('#call');if(!el.classList.contains('open'))return;clearTimeout(el._t);el.classList.remove('open');toast('Call ended')}
function closeDrawers(){document.body.classList.remove('d-left','d-right')}

/* ---------- drag and drop ---------- */
let dragN=0;const convo=$('#convo'),drop=$('#drop');
convo.addEventListener('dragenter',e=>{if(![...e.dataTransfer.types].includes('Files'))return;e.preventDefault();dragN++;$('#dropTx').textContent='Drop to share with '+cur().name.split(' ')[0];drop.classList.add('on')});
convo.addEventListener('dragover',e=>{if([...e.dataTransfer.types].includes('Files'))e.preventDefault()});
convo.addEventListener('dragleave',()=>{if(--dragN<=0){dragN=0;drop.classList.remove('on')}});
convo.addEventListener('drop',e=>{e.preventDefault();dragN=0;drop.classList.remove('on');if(e.dataTransfer.files.length)addFiles(e.dataTransfer.files)});

/* ---------- global events ---------- */
document.addEventListener('click',e=>{
  const t=e.target;
  if(!t.closest('.pw')&&!t.closest('#moreBtn')&&!t.closest('#moreMenu'))closePops();
  let b;
  if(b=t.closest('[data-nav]')){const v=b.dataset.nav;setView(S.view===v&&!isMob()?null:v);return}
  if(b=t.closest('[data-back]')){setView(null);if(isMob())setPage('media');return}
  if(b=t.closest('[data-go]')){closePops();if(b.dataset.go==='chat'&&S.view)setView(null);setPage(b.dataset.go);return}
  if(b=t.closest('[data-mrec]')){openViewer(mediaItems(cur(),'media').map(x=>x.a),+b.dataset.mrec);return}
  if(b=t.closest('.ci')){const q=S.q.trim().toLowerCase();const c=C.find(x=>x.id===b.dataset.id);const hit=q?[...c.msgs].reverse().find(m=>m.text.toLowerCase().includes(q)||m.atts.some(a=>a.type==='doc'&&docText(a).includes(q))):null;openChat(b.dataset.id,hit);return}
  if(t.closest('#scrim')){closeDrawers();return}
  if(b=t.closest('[data-call]')){closePops();startCall(b.dataset.call);return}
  if(t.closest('#moreBtn')){togglePop($('#moreMenu'));return}
  if(b=t.closest('[data-more]')){closePops();const c=cur(),k=b.dataset.more;
    if(k==='media')setView('media');
    if(k==='mute'){S.muted.has(c.id)?S.muted.delete(c.id):S.muted.add(c.id);renderHead();renderList();toast(S.muted.has(c.id)?`Notifications muted for ${c.name}`:`Notifications on for ${c.name}`)}
    if(k==='clear')confirmBox('Clear this chat?',`All messages with ${c.name} will be removed from this device.`,'Clear chat','red',()=>{const saved=c.msgs;c.msgs=[];renderMsgs();renderList();renderNav();if(S.view)renderMedia();toast('Chat cleared','Undo',()=>{c.msgs=saved;renderMsgs();renderList();renderNav();if(S.view)renderMedia()})});
    return}
  if(t.closest('#attachBtn')){const o=togglePop($('#attachPop'));$('#attachBtn').classList.toggle('open',o);return}
  if(t.closest('#emojiBtn')){togglePop($('#emojiPop'));return}
  if(b=t.closest('[data-acc]')){closePops();const f=$('#file');f.accept=b.dataset.acc;f.click();return}
  if(b=t.closest('[data-emo]')){const s=txt.selectionStart??txt.value.length,en=txt.selectionEnd??s;txt.setRangeText(b.dataset.emo,s,en,'end');fit();txt.focus();return}
  if(b=t.closest('[data-gal]')){const m=cur().msgs.find(x=>x.id===+b.dataset.gal);openViewer(m.atts.filter(a=>a.type==='image'),+b.dataset.i);return}
  if(b=t.closest('[data-vid]')){openViewer([attByKey(b.dataset.vid)],0);return}
  if(b=t.closest('[data-pdf]')){openViewer([attByKey(b.dataset.pdf)],0);return}
  if(b=t.closest('[data-dl]')){download(attByKey(b.dataset.dl));return}
  if(b=t.closest('[data-mv]')){openViewer(mediaItems(cur(),S.view).map(x=>x.a),+b.dataset.mv);return}
  if(b=t.closest('.ap')){toggleAudio(b.closest('[data-aud]').dataset.aud);return}
  if(b=t.closest('.wave')){const r=b.getBoundingClientRect();seekAudio(b.closest('[data-aud]').dataset.aud,(e.clientX-r.left)/r.width);return}
  if(b=t.closest('[data-doc]')){download(attByKey(b.dataset.doc));return}
});
document.addEventListener('keydown',e=>{
  if($('#gal').classList.contains('open')){if(e.key==='Escape')closeViewer();if(e.key==='ArrowRight')go(G.i+1);if(e.key==='ArrowLeft')go(G.i-1);return}
  if(e.key==='Escape'){if($('#modal').classList.contains('open'))return closeModal();if($('#call').classList.contains('open'))return endCall();if(R.rec)return cancelRec();if(document.querySelector('.pop.open'))return closePops();if(document.body.className.includes('d-'))return closeDrawers();if(S.view){setView(null);if(isMob())setPage('media');return}if(isMob()&&document.body.dataset.page==='chat')return setPage('home')}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#q').focus()}
});
$('#q').addEventListener('input',e=>{S.q=e.target.value;$('#sbox').classList.toggle('has',!!S.q);renderList()});
$('#qClr').addEventListener('click',e=>{e.preventDefault();$('#q').value='';S.q='';$('#sbox').classList.remove('has');renderList();$('#q').focus()});
$('#logout').onclick=()=>confirmBox('Log out of ChatEase?','You can log back in any time.','Log out','red',()=>{stopAudio();endCall();cancelRec();$('#out').classList.add('open');setTimeout(()=>$('#relog').focus(),100)});
$('#relog').onclick=()=>{$('#out').classList.remove('open');$('#logout').focus()};

document.body.dataset.page='home';
mq.addEventListener?.('change',()=>{renderHead();if(S.view)renderMedia();renderTabs()});
function renderAll(keep){paintStatic();renderNav();renderHead();renderList(!keep);renderPending();if(S.view)renderMedia();else renderMsgs(false,keep)}
renderAll(false);fit();

/* load the Streamline Flex icon set, then repaint with it */
(async()=>{
  for(const u of['https://cdn.jsdelivr.net/npm/@iconify-json/streamline-flex@1/+esm','https://cdn.jsdelivr.net/npm/@iconify-json/streamline-flex@1/icons.json/+esm']){
    try{
      const m=await import(u);
      const set=[m.icons,m.default,m.default?.icons,m].find(s=>s&&s.icons&&s.prefix);
      if(!set)continue;
      let n=0;
      for(const[k,name]of Object.entries(SFN)){let nm=name,ic=set.icons[nm];if(!ic&&set.aliases?.[nm]){nm=set.aliases[nm].parent;ic=set.icons[nm]}
        if(ic){SF[k]={body:ic.body,w:ic.width||set.width||16,h:ic.height||set.height||16};n++}}
      if(n){renderAll(true);return}
    }catch(e){}
  }
})();
}
